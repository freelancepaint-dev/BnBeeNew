name: Build BnBeeHive

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm --prefix web install

      - name: Compile BakedBeans with Solidity 0.8.9
        run: npm run compile

      - name: Build BnBeeHive web app
        run: npm run build
