name: Build BnBeeHive

on:
  push:
    branches: [mainnet]
  pull_request:
    branches: [mainnet]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm --prefix web install

      - name: Compile BakedBeans with Solidity 0.8.9
        run: npm run compile

      - name: Build BnBeeHive web app
        run: npm run build
      - name: Show generated index
        run: cat web/dist/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
